# ESKİ adres otoxray.cybergene.co — alan adı geçişinden SONRA (deploy/alan-adi-gecisi.sh kurar).
# Geçiş dönemi: eski eklenti sürümleri çalışmaya devam etsin diye /api/v1 ve /healthz aynı uygulamaya gider (cihaz
# anahtarları alan adından bağımsız). Tarayıcıyla açılan her şey (yönetim sayfası dahil) yeni adrese kalıcı yönlenir.
# Tüm kullanıcılar 0.2.0+ sürüme geçince bu site kaldırılabilir.
server {
    server_name otoxray.cybergene.co;

    access_log off;
    client_max_body_size 8m;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8991;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8991;
        proxy_set_header Host $host;
    }
    location / {
        return 301 https://cyberoto.cybergene.co$request_uri;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/otoxray.cybergene.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/otoxray.cybergene.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name otoxray.cybergene.co;
    return 301 https://cyberoto.cybergene.co$request_uri;
}
