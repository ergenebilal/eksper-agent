# CyberOto AI API (CyberGene) — yalnız /api/v1, /yonetim ve /healthz dışarı açılır; uygulama 127.0.0.1:8991 (systemd: otoxray)
server {
    listen 80;
    listen [::]:80;
    server_name otoxray.cybergene.co;

    access_log off;                 # ilan no / IP birikmesin
    client_max_body_size 256k;

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8991;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;    # LLM çözümlemesi uzun sürebilir
    }
    location /yonetim {
        proxy_pass http://127.0.0.1:8991;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8991;
        proxy_set_header Host $host;
    }
    location / {
        return 404;
    }
}
