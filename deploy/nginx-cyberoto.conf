# CyberOto AI API (CyberGene) — yalnız / (tanıtım), /kurulum, /api/v1, /yonetim ve /healthz dışarı açılır; uygulama 127.0.0.1:8991 (systemd: otoxray)
# /etc/nginx/sites-available/cyberoto.cybergene.co — HTTPS satırlarını `certbot --nginx -d cyberoto.cybergene.co` ekler
# (deploy/alan-adi-gecisi.sh). Eski adres için: nginx-otoxray-gecis.conf.
server {
    listen 80;
    listen [::]:80;
    server_name cyberoto.cybergene.co;

    access_log off;                 # ilan no / IP birikmesin
    client_max_body_size 8m;        # belge röntgeni: PDF en fazla 4 MB (base64 ≈ 5,4 MB)

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8991;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;    # LLM çözümlemesi uzun sürebilir
    }
    location /yonetim {
        proxy_pass http://127.0.0.1:8991;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8991;
        proxy_set_header Host $host;
    }
    location /kurulum {             # davet e-postasındaki kurulum sayfası + eklenti paketi
        proxy_pass http://127.0.0.1:8991;
        proxy_set_header Host $host;
    }
    location = / {                  # tek sayfalık tanıtım (kapalı beta, noindex)
        proxy_pass http://127.0.0.1:8991;
        proxy_set_header Host $host;
    }
    location / {
        return 404;
    }
}
