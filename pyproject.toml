[project]
name = "eksper-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "apscheduler>=3.11.3",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.27.0",
    "lxml>=6.1.3",
    "numpy>=2.4.6",
    "openai>=3.24.0",
    "playwright>=1.63.0",
    "pydantic-settings>=2.15.0",
    "requests>=2.31.0",
    "pytest>=9.1.1",
    "python-telegram-bot>=22.8",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.3",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "pypdf>=6.19.0",
]

[project.scripts]
arac = "arac_eksper.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arac_eksper"]

[tool.pytest.ini_options]
markers = ["e2e: gerçek Chromium + eklenti uçtan uca testi (Chromium gerekir)"]
