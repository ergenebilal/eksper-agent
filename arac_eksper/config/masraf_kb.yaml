# Masraf bilgi tabanı — gerçek maliyet hesabı için (CyberOto_Arge.md R2.1)
#
# ⚠ TASLAK: Claude, 2026-10-07. Fiyatlar Ekim 2026 Türkiye piyasası için KABA TAHMİNDİR (işçilik dahil, özel servis
#   ortalaması; yetkili servis genelde üst sınıra yakın ya da üstündedir). HİÇBİR KALEM ONAYLI DEĞİL.
#   Kural 5: LLM tutar uydurmaz; yalnız kalemi tanır (anahtar_kelimeler), tutar BURADAN gelir ve ARALIK olarak gösterilir.
#   Kural 10: `onayli: false` kalem hesaba girmez. Kullanıcı (ustaya danışarak) aralıkları düzeltir, `onayli: true` yapar.
#   Fiyatlar enflasyonla eskir: `fiyat_tarihi` 6 aydan eskiyse `arac kb kontrol` uyarır.
#   Doğrulama: `uv run arac kb kontrol`

para_birimi: TRY
fiyat_tarihi: "2026-10"
kaynak: "Taslak (Claude, 2026-10-07): genel servis/parça piyasası tahmini; usta onayı bekliyor"

# Segment = parça/işçilik fiyat düzeyi (araç fiyatı değil). Eşleşme: marka + seri (ilan "Seri"), Türkçe harf farkı yok sayılır.
# Listede olmayan araç: premium markaysa "premium", değilse "bilinmiyor" (hesapta ekonomik alt sınırı ile üst segment üst sınırı arası).
