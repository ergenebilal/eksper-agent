# Her kalem: kod, ad, anahtar_kelimeler (ilan metninde tanıma — R2.2), aralik {ekonomik, orta, ust, premium}: [alt, üst] TL,
# not (ops.), onayli. Aralık: tek parça/tek işlem (adet belirtilmişse adet başına).
kalemler:
  # ---------------------------------------------------------------- periyodik / ağır bakım
  - {kod: periyodik_bakim, ad: "Periyodik bakım (yağ + filtreler)", anahtar_kelimeler: ["bakımı gelmiş", "bakım zamanı", "yağ bakımı"],
     aralik: {ekonomik: [4000, 7000], orta: [5500, 9500], ust: [8000, 14000], premium: [12000, 25000]}, onayli: false}
  - {kod: triger_seti, ad: "Triger seti + devirdaim", anahtar_kelimeler: ["triger", "eksantrik kayışı", "triger kayışı"],
     aralik: {ekonomik: [9000, 16000], orta: [12000, 22000], ust: [18000, 32000], premium: [25000, 55000]},
     not: "Zincirli motorlarda zincir seti daha pahalıdır (zincir_seti)", onayli: false}
