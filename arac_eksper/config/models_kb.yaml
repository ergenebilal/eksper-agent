# Model bilgi tabanı — kronik arızalar, km eşikleri, periyodik bakım (CyberOto_Arge.md R1.1)
#
# Claude tarafından genel piyasa/servis bilgisinden 2026-10-06'da hazırlandı; kullanıcı 2026-10-07'de sohbette TOPLU onayladı
#   (satır satır usta incelemesi yapılmadı). Kural 10: `onayli: false` olan kayıt kararı, puanı ve listeyi ETKİLEMEZ.
#   Yanlış bulunan maddeyi düzeltin ya da kaydı `onayli: false` yapın; emin olunmayanı silmek, yanlış bırakmaktan iyidir.
#   Doğrulama: `uv run arac kb kontrol`
#
# Alanlar
#   marka, model      : ilan sayfasındaki "Marka" ve "Seri" (ör. Renault / Megane). Büyük-küçük harf ve Türkçe harf farkı yok sayılır.
#   yil_min/yil_max   : model yılı aralığı (dahil)
#   kronik[]          : etiket (kısa ad), kontrol (ekspertizde ne yapılmalı)
#     motor           : (ops.) ilan "Model"/paket ya da başlığında geçmesi gereken ifade(ler), ör. "1.5 dCi" ya da ["1.6 TDI","2.0 TDI"]
#                       NOT (2026-10-07, 13 gerçek sayfa): şanzıman türü (EDC, DSG, Powershift, DCT, CVT, Easy-R…) ilanın hiçbir
#                       alanında geçmiyor. Bu yüzden şanzıman maddeleri motor adıyla değil "vites + model + yıl aralığı" ile eşleşir:
#                       VARSAYIM = bu model ve yıllarda otomatik/yarı otomatik vites büyük ölçüde o şanzımandır. Onaylarken teyit edin.
#     vites           : (ops.) "otomatik" | "manuel" | "yari_otomatik"
#     yakit           : (ops.) "dizel" | "benzin" | "lpg" | "hibrit"
#     km_esik         : (ops.) bu km'den sonra risk belirginleşir → madde "tetiklenir", listede öne çıkar
#     ciddiyet        : yuksek | orta | dusuk  (puana yalnız "yuksek" + tetiklenmiş madde yansır: rules.yaml kronik_ariza)
#   bakim[]           : periyodik ağır bakım (R2 gerçek maliyet ve soru çarşafı için): kalem, aralik_km [alt, üst], motor (ops.), not,
#                       masraf (ops.): masraf_kb.yaml kalem kodu (tutar oradan gelir)
#   kaynak, onayli    : kaydın dayanağı ve onay durumu

models:
  # ---------------------------------------------------------------- Renault / Dacia (1.5 dCi K9K, EDC, Easy-R)
  - marka: Renault
    model: Megane
    yil_min: 2012
    yil_max: 2023
    kronik:
      - {etiket: "EDC şanzıman kavrama aşınması", vites: otomatik, km_esik: 100000, ciddiyet: yuksek,
         kontrol: "Test sürüşünde kalkışta ve 1-2 vites geçişinde silkeleme/titreme olup olmadığına bakın; şanzıman hata kayıtlarını okutun"}
      - {etiket: "1.5 dCi DPF/EGR tıkanması", motor: ["1.5 dCi", "1.5 Blue dCi"], km_esik: 150000, ciddiyet: orta,
         kontrol: "DPF doluluk ve EGR hata kayıtlarını cihazla okutun; şehir içi kullanımı sorun"}
      - {etiket: "1.5 dCi biyel/yatak sesi (yüksek km)", motor: ["1.5 dCi"], km_esik: 200000, ciddiyet: orta,
         kontrol: "Soğuk çalıştırmada alt taraftan vuruntu sesi dinletin; yağ bakım geçmişini isteyin"}
    bakim:
      - {kalem: "Triger seti + devirdaim", masraf: triger_seti, motor: ["1.5 dCi"], aralik_km: [120000, 160000], not: "Kayışlı; değiştiyse fatura isteyin"}
    kaynak: "Taslak (Claude, 2026-10-06): genel servis/piyasa bilgisi. Onay: kullanıcı, 2026-10-07 (sohbette, toplu)"
    onayli: true

