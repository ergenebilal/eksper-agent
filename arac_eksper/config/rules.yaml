# rules.yaml — SPEC.md §4.3 ile birebir. Ağırlıkları ve eşikleri yalnızca kullanıcı değiştirir.
rules:
  hard_fails:
    max_sapma: 0.25              # ilan fiyatı piyasa medyanının %25 üstündeyse ele
    max_yillik_km: 45000         # yıllık km bunun üstündeyse ele (filo/taksi riski)
    dolandiricilik_sapma: -0.20  # dolandırıcılık sinyali + medyanın %20'den ucuzsa ele
    tavan_elenen_durumlar: ["lokal_boyali", "boyali", "degisen"]
    butce_asimi: true            # ilan fiyatı kullanıcı bütçesini aşıyorsa ele

  etiket:
    alinmaz_skor_alti: 5.5       # skor bunun altındaysa ALINMAZ
    alinir_min_skor: 7.5
    alinir_max_sapma: -0.05      # plan matrisi: ALINIR = piyasa medyanından en az %5 uygun; medyanda = DÜŞÜNÜLEBİLİR
    alinir_min_tamlik: 0.6
    min_emsal: 5                 # bunun altında piyasa karşılaştırması güvenilmez -> ALINIR olamaz

  scoring:
    lokal_boyali_parca: -0.3
    boyali_parca: -0.6
    degisen_parca: -1.2
    degisen_kaput_bagaj: -1.5
    tampon_boya_degisen: -0.1
    unknown_parca: -0.25
    unknown_max: -1.5

    tramer_0_5: -0.3
    tramer_5_10: -1.0
    tramer_10_plus: -2.0
    tramer_bilinmiyor: -0.5

    yillik_km_25_35: -0.8
    yillik_km_35_45: -1.8
    yillik_km_suphe: -1.0

    olumsuz_sinyal: -0.7
    belirsiz_ifade: -0.3
    olumlu_sinyal: 0.4
    olumlu_max: 1.0

    sapma_eksi_5_15: 0.5
    sapma_eksi_20: 0.0

    kronik_ariza: -0.5   # models_kb.yaml'da eşleşen her kayıt için

  # Daha önce kodda gömülü olan bant/eşik/oranlar. DEĞERLER DEĞİŞMEDİ, yalnızca buraya taşındı;
  # bundan sonra ayarlanacaksa tek yer burasıdır (kural 7).
  bantlar:
    tramer_orani_alt: 0.05        # tramer/fiyat <= bu: tramer_0_5
    tramer_orani_ust: 0.10        # <= bu: tramer_5_10, üstü: tramer_10_plus
    yillik_km_orta: 25000         # [orta, yuksek) arası yillik_km_25_35
    yillik_km_yuksek: 35000       # [yuksek, hard fail] arası yillik_km_35_45
    yillik_km_suphe_alt: 4000     # altı + aşağıdaki yaşta: km düşürme şüphesi
    yillik_km_suphe_min_yas: 5
    sapma_bonus_alt: -0.15        # [alt, ust] arası sapma_eksi_5_15 bonusu
    sapma_bonus_ust: -0.05
    sapma_ucuz_uyari: -0.20       # bunun altı: "neden bu kadar ucuz?" uyarısı

  tamlik:
    parca_yok: 0.3                # hiç bilinen parça yoksa düşülür
    tramer_bilinmiyor: 0.1
    piyasa_yetersiz: 0.3

  piyasa:
    gun: 30
    dar_km_payi: 0.30
    genis_km_payi: 0.50
    dar_min_n: 8                  # bunun altında bir sonraki aşamaya genişletilir
    min_km_bandi: 10000           # YENİ (6 Ekim 2026, eklenti): km bandı en az ±bu kadar (km=0 araçta emsal bandı sıfıra düşmesin). Yalnızca durumsuz otoXray hesabında kullanılır

  teklif:
    lokal_boyali: 0.01
    boyali: 0.02
    degisen: 0.04
    tramer_payi: 0.5
    km_orta_esik: 25000
    km_orta_indirim: 0.02
    km_yuksek_esik: 35000
    km_yuksek_indirim: 0.03
    max_indirim: 0.15
    taban_orani: 0.85
    pazarlik_dusuk_skor: 0.04     # skor < pazarlik_skor_esik
    pazarlik_yuksek_skor: 0.02
    pazarlik_skor_esik: 7.0
    aciliyet_ek_orta: 0.01        # R4.1: satış motivasyonu ortaysa açılış teklifi ayrıca bu kadar aşağı
    aciliyet_ek_yuksek: 0.02

  sinyal:                         # R4.1/R4.2 (7 Ekim 2026): satış motivasyonu bandı ve ticari dil sinyali
    aciliyet_orta: 2              # puan >= bu: orta
    aciliyet_yuksek: 4            # puan >= bu: yüksek
    ilan_gun_orta: 30             # ilan bu kadar gündür yayında: +1
    ilan_gun_uzun: 60             # +2 (orta yerine)
    fiyat_degisti_puan: 1         # sitenin "fiyat değişti" bayrağı
    gorulen_dusus_puan: 1         # kullanıcının kendi gördüğü fiyat düşüşü
    ticari_min_ifade: 2           # en az bu kadar FARKLI ticari ifade: sinyal

  rozet:                          # yalnızca liste rozeti (GÖRSEL); karar etiketini etkilemez
    pahali_esik: 0.05             # sapma bunun üstündeyse "pahalı" rozeti

  radar:
    fiyat_dusus_orani: 0.03
