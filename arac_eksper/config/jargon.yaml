# Türk ikinci el araç piyasası jargonu sözlüğü
jargon:
  "podye": "Şasenin ön kısmı, kazalarda kritik"
  "şase ucu": "Şasenin darbe emen uç kısmı, işlemli olması değer kaybettirir"
  "direk": "Aracın iskeleti, tavanı taşıyan sütunlar"
  "sandık motor": "Tamamen sıfır takılmış yeni motor"
  "kafa yapıldı": "Aracın ön bölümü ağır hasar alıp yeniden toplanmış"
  "bedelsiz": "Hasar kaydı var ama tutarı belli değil (ağır hasar olabilir)"
  "çekme belgeli": "Trafikten men edilmiş, genellikle pert"
  "sigorta şişirmesi": "Ağır hasar kaydını gizlemek için uydurulan bahane"
  "takas fiyatı farklı": "Sıcak paraya ihtiyacı var veya arabaya değerinden fazla biçiyor"
  "hatasız": "Hiçbir kusuru, boyası, değişeni yok"
  "hatasız gibi": "Aslında kusurları var ama göze batmıyor (yalan olabilir)"
  "kaporta temiz": "Boya/değişen bilgisi vermiyor, sadece kozmetik iyi diyor"
  "ufak tefek": "Maliyetli ama küçümsenen masraflar"
  "bel altı boyalı": "Tavan hariç komple boyalı"
