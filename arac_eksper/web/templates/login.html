<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş · Araç Eksper</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="login card">
  <h1>Araç Eksper</h1>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post" action="/login">
    <p><input type="password" name="token" required autofocus autocomplete="current-password" style="width:100%" placeholder="Erişim jetonu"></p>
    <button class="pri" type="submit">Giriş</button>
  </form>
</div>
</body>
</html>
