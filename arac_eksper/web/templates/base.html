<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Araç Eksper Panel{% endblock %}</title>
    <!-- Tailwind via CDN for rapid mobile-first styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                    }
                }
            }
        }
    </script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .btn { padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background-color: #3b82f6; color: white; }
        .btn-primary:hover { background-color: #2563eb; }
        .card { background-color: #1e293b; border-radius: 0.75rem; padding: 1rem; border: 1px solid #334155; }
    </style>
</head>
<body class="antialiased font-sans" hx-boost="true">

    <!-- Navbar -->
    <nav class="bg-cardbg border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-bold text-white flex items-center gap-2">
                🚗 Eksper
            </a>
            <div class="flex gap-4 text-sm font-medium">
                <a href="/" class="hover:text-blue-400 transition-colors">Genel Bakış</a>
                <a href="/logout" class="text-slate-400 hover:text-red-400 transition-colors">Çıkış</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto p-4 mt-2">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
