<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Araç Eksper{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav>
  <a href="/" class="{{ 'on' if nav == 'home' }}">Genel Bakış</a>
  <a href="/listings" class="{{ 'on' if nav == 'listings' }}">İlanlar</a>
  <a href="/events" class="{{ 'on' if nav == 'events' }}">Bildirimler</a>
  <a href="/system" class="{{ 'on' if nav == 'system' }}">Sistem</a>
  <span class="sp"></span>
  <form method="post" action="/logout"><input type="hidden" name="csrf" value="{{ csrf }}"><button type="submit">Çıkış</button></form>
</nav>
<main>
{% block content %}{% endblock %}
<p class="disc">🟢 = “ekspertize götürmeye değer”, “al” değil. Şase, direk, podye ve airbag ilandan doğrulanamaz.</p>
</main>
</body>
</html>
