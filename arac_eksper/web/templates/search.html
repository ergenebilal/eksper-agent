{% extends "base.html" %}

{% block content %}
<div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-white">Yeni Arama Görevi</h2>
</div>

<div class="card max-w-2xl">
    <div class="bg-blue-900/30 border border-blue-800 text-blue-200 p-4 rounded-lg mb-6 text-sm">
        ℹ️ <strong>Bilgi:</strong> Arama işlemi arka planda iş kuyruğuna alınır ve Playwright ile toplanır. Arama devam ederken bu ekrandan veya terminalden süreci izleyebilirsiniz.
    </div>

    <form class="space-y-4">
        <!-- Not functional yet, this is just P0 layout -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Marka</label>
                <input type="text" placeholder="örn. Renault" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Model</label>
                <input type="text" placeholder="örn. Megane" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-400 mb-1">Seri (Opsiyonel)</label>
            <input type="text" placeholder="örn. 1.5 dCi Touch" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="col-span-2">
                <label class="block text-sm font-medium text-slate-400 mb-1">Maksimum Bütçe (TL)</label>
                <input type="number" placeholder="1000000" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Minimum Yıl</label>
                <input type="number" placeholder="2016" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-400 mb-1">Maksimum KM</label>
                <input type="number" placeholder="150000" class="w-full bg-slate-900 border border-slate-700 rounded p-2.5 text-white">
            </div>
        </div>

        <div class="pt-4 flex items-center justify-end gap-3">
            <a href="/listings" class="text-sm text-slate-400 hover:text-white">İptal</a>
            <button type="button" class="btn btn-primary opacity-50 cursor-not-allowed">
                Aramayı Başlat
            </button>
        </div>
        <div class="text-right text-xs text-slate-500">
            Arama API'si (P1) henüz aktif edilmedi.
        </div>
    </form>
</div>
{% endblock %}
